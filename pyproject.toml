[project]
name = "voice"
version = "0.3.0"
description = "Hardware-adaptive Arabic voice platform with Egyptian KemeTone TTS and multi-provider AI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "psutil>=6,<7",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
tts = [
  "kokoro>=0.9.4",
  "torch>=2.1",
  "soundfile>=0.12",
  "numpy>=1.26,<3",
  "huggingface-hub>=0.27,<1",
]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
