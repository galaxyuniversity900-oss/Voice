<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Voice Studio</title>
  <style>
    :root{font-family:system-ui,sans-serif;color-scheme:dark}body{margin:0;background:#101114;color:#f5f5f5}main{max-width:760px;margin:auto;padding:24px}textarea,select,button{width:100%;box-sizing:border-box;margin-top:10px;padding:13px;border:1px solid #363940;border-radius:10px;background:#191b20;color:inherit;font:inherit}textarea{min-height:220px;resize:vertical}button{cursor:pointer;background:#f5f5f5;color:#111;font-weight:700}button:disabled{opacity:.55;cursor:wait}pre{white-space:pre-wrap;background:#191b20;padding:14px;border-radius:10px;overflow:auto}audio{width:100%;margin-top:16px}.meta{opacity:.75;font-size:.9rem}.actions{display:grid;gap:8px;margin-top:8px}.download{display:none;text-align:center;padding:12px;border:1px solid #363940;border-radius:10px;color:inherit;text-decoration:none}</style>
</head>
<body>
<main>
  <h1>Voice Studio</h1>
  <p class="meta">توليد صوت عربي مصري — KemeTone يعمل محلياً بعد تنزيل النموذج أول مرة</p>
  <label for="dialect">اللهجة</label>
  <select id="dialect"><option value="ar-eg">العربية المصرية</option><option value="ar-msa">العربية الفصحى</option><option value="ar-gulf">العربية الخليجية</option><option value="ar-sa">العربية السعودية</option></select>
  <textarea id="text" placeholder="اكتب النص هنا..."></textarea>
  <div class="actions">
    <button id="prepare">تجهيز النص</button>
    <button id="generate">توليد الصوت</button>
  </div>
  <pre id="result">جاهز</pre>
  <audio id="audio" controls></audio>
  <a id="download" class="download" download="voice.wav">تنزيل الصوت WAV</a>
</main>
<script>
const $=id=>document.getElementById(id);
async function payload(){return {text:$('text').value,dialect:$('dialect').value,language:'ar',speed:1};}
$('prepare').onclick=async()=>{
  const response=await fetch('/api/prepare',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(await payload())});
  const data=await response.json();$('result').textContent=response.ok?data.text:(data.detail||'حدث خطأ');
};
$('generate').onclick=async()=>{
  if(!$('text').value.trim())return;
  $('generate').disabled=true;$('result').textContent='جارٍ تنزيل النموذج/توليد الصوت...';
  try{
    const response=await fetch('/api/synthesize',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(await payload())});
    if(!response.ok){const data=await response.json();throw new Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));}
    const blob=await response.blob();const url=URL.createObjectURL(blob);$('audio').src=url;$('download').href=url;$('download').style.display='block';$('result').textContent='تم توليد الصوت.';
  }catch(error){$('result').textContent=error.message||'تعذر توليد الصوت.';}finally{$('generate').disabled=false;}
};
</script>
</body>
</html>
